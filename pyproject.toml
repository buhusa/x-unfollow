[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "x-unfollow"
version = "0.1.0"
description = "API-only CLI for reviewing and unfollowing inactive X accounts"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "buhusa" },
]
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "httpx>=0.27",
  "readchar>=4.2",
  "tomli-w>=1.0",
]

[project.urls]
Homepage = "https://buhussy.xyz"
Repository = "https://github.com/buhusa/x-unfollow"
Issues = "https://github.com/buhusa/x-unfollow/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "respx>=0.21",
  "pytest-cov>=5.0",
]

[project.scripts]
x-unfollow = "x_unfollow.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
